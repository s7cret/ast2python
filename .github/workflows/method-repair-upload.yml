name: Publish exact method execution regressions
'on':
  push:
    branches: ['ops/stage2-method-repair-20260911']
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s7cret/pine2ast
          ref: 9c9672991872b82ba34e8cc1237a7c36e633b1dd
          path: publisher
          sparse-checkout: .github/method-repair/publish.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cp publisher/.github/method-repair/publish.py "$RUNNER_TEMP/publish.py"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore checked original source into candidate only
        run: |
          cp -R .github/method-repair "$RUNNER_TEMP/method-repair"
          python "$RUNNER_TEMP/publish.py" "$RUNNER_TEMP/method-repair"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: method-repair-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
          retention-days: 14
