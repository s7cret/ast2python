name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ast2python
      - uses: actions/checkout@v4
        with:
          repository: s7cret/openpine-contracts
          ref: 91c405e759206b542d22df242ef55ac49b1f0bb4
          path: openpine-contracts
      - uses: actions/checkout@v4
        with:
          repository: s7cret/pine2ast
          ref: a5870fc40b790b764d70e4eac9db0abbb31a2a15
          path: pine2ast
      - uses: actions/checkout@v4
        with:
          repository: s7cret/pinelib
          ref: 7e681f3ce2945d2ba702833b1f82aa4da133d909
          path: pinelib
      - uses: actions/checkout@v4
        with:
          repository: s7cret/marketdata-provider
          ref: b82216eb2ee899fbfec43bdd367b375a2603c5f3
          path: marketdata-provider
      - uses: actions/checkout@v4
        with:
          repository: s7cret/backtest_engine
          ref: 2698f128414bad382ddd98f4aa025bc9a43fe553
          path: backtest_engine
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ./openpine-contracts
          python -m pip install -e ./marketdata-provider[dev]
          python -m pip install -e ./pinelib[dev]
          python -m pip install -e ./pine2ast[dev]
          python -m pip install -e ./backtest_engine
          python -m pip install -e ./ast2python[dev]
          mkdir -p "$RUNNER_TEMP/stack-wheels"
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./openpine-contracts
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./pinelib
          python -m build --wheel --outdir "$RUNNER_TEMP/stack-wheels" ./pine2ast
      - name: Ruff lint
        run: python -m ruff check .
        working-directory: ast2python
      - name: Black format check
        run: python -m black --check . --workers 1
        working-directory: ast2python
      - name: MyPy type check
        run: python -m mypy ast2python
        working-directory: ast2python
      - name: Unit tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/unit/ -v --tb=short
        working-directory: ast2python
      - name: Integration tests (non-E2E)
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/integration/ -v --tb=short -k "not cross_project"
        working-directory: ast2python
        env:
          PINE_STACK_ROOT: ${{ github.workspace }}
      - name: Coverage gate
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q -p pytest_cov --cache-clear tests/unit tests/integration --cov=ast2python --cov-report=term
        working-directory: ast2python
        env:
          PINE_STACK_ROOT: ${{ github.workspace }}
      - name: Release checks
        run: |
          python -m ast2python.quality duplicates ast2python
          python -m ast2python.quality architecture ast2python --max-lines 700
          python -m ast2python.lowering_matrix.validate
          python -m ast2python.distribution manifest --root .
          python -m ast2python.release --root .
        working-directory: ast2python
      - name: Wheel install smoke test
        run: >-
          OPENPINE_CONTRACTS_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/openpine_contracts-*.whl)"
          OPENPINE_PINE2AST_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/pine2ast-*.whl)"
          OPENPINE_PINELIB_WHEEL="$(echo "$RUNNER_TEMP"/stack-wheels/pinelib-*.whl)"
          OPENPINE_PRODUCER_COMMITS_JSON="{\"pine2ast\":\"a5870fc40b790b764d70e4eac9db0abbb31a2a15\",\"ast2python\":\"$GITHUB_SHA\",\"pinelib\":\"7e681f3ce2945d2ba702833b1f82aa4da133d909\",\"openpine-contracts\":\"91c405e759206b542d22df242ef55ac49b1f0bb4\"}"
          PYTHON=python bash scripts/wheel_smoke.sh
        working-directory: ast2python
