[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ast2python"
version = "5.0.0rc6"
description = "Strict version-exact Pine lowering, deterministic Python emission, source maps, and generated artifacts for OpenPine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Interpipe Solutions"}]
dependencies = [
  "pine2ast==5.0.0rc6",
]

[project.urls]
Homepage = "https://github.com/s7cret/ast2python"
Repository = "https://github.com/s7cret/ast2python"
Issues = "https://github.com/s7cret/ast2python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "black>=24", "mypy>=1.10"]

[project.scripts]
ast2python = "ast2python.cli.main:main"

[tool.setuptools.packages.find]
include = ["ast2python*"]

[tool.setuptools.package-data]
ast2python = ["py.typed", "target_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
packages = ["ast2python"]
strict = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["ast2python"]
omit = [
  "ast2python/__main__.py",
  "ast2python/cli/*",
  "ast2python/distribution.py",
  "ast2python/release.py",
  "ast2python/hardening/*",
  "ast2python/target_data/*",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
