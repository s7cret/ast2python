[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ast2python"
version = "4.0.2"
description = "AST2Python generator for Pine AST to PineLib Python modules"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "OpenAI Codex" }]
dependencies = [
  "openpine-contracts @ git+https://github.com/s7cret/openpine-contracts.git@af9ecbc455e9af83cdc609f6b6ff85c40fb6c8bb",
  "pinelib @ git+https://github.com/s7cret/pinelib.git@fcf9c0f92213313db39bc42c83f676786c85400c",
  "pine2ast @ git+https://github.com/s7cret/pine2ast.git@c57323351a1e638e0337e1be247883da2570ab28",
]

[project.urls]
Homepage = "https://github.com/s7cret/ast2python"
Repository = "https://github.com/s7cret/ast2python"
Issues = "https://github.com/s7cret/ast2python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "black>=24",
  "mypy>=1.10",
  "build>=1.2",
  "backtest-engine @ git+https://github.com/s7cret/backtest_engine.git@329b9905bff2ea0b7b7f48662e4ce8b83d919c60",
]

[project.scripts]
ast2python = "ast2python.cli.main:main"

[tool.setuptools.packages.find]
include = ["ast2python*"]

[tool.setuptools.package-data]
ast2python = ["lowering_matrix/*.json"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["dist", "build", "tests/fixtures", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
# Golden generated-code snapshots intentionally mirror emitter output byte-for-byte;
# tests assert exact strings, so lint/format changes belong in the emitter first.
"tests/fixtures/expected/**/*.py" = ["E501", "F401", "I001", "B905"]
"ast2python/translator_parts/shared.py" = ["F401"]
"ast2python/translator_parts/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "../pinelib", "../pine2ast"]

[tool.mypy]
python_version = "3.11"
packages = ["ast2python"]
mypy_path = [".", "../pinelib", "../pine2ast"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_optional = true
exclude = ["dist", "build", "tests/fixtures", ".venv"]

[[tool.mypy.overrides]]
module = ["pinelib", "pinelib.*", "pine2ast", "pine2ast.*"]
ignore_missing_imports = true
follow_imports = "silent"

[tool.coverage.report]
fail_under = 100
show_missing = false
